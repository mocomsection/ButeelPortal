<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buteel Creator Portal Wireframe</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --bg:#f7f7f9;--panel:#fff;--line:#ddddE5;--text:#262633;--muted:#7c7f8d;
  --accent:#6b50f6;--accent-soft:#f2efff;--danger:#cf4b5e;--ok:#2d8a63
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Nunito Sans",sans-serif;color:var(--text);font-size:14px}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{min-height:100vh;display:block}
main{padding:28px 34px 60px}
.wrap{max-width:980px;margin:auto}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.header h1{margin:0;font-size:25px}
.header p{margin:4px 0;color:var(--muted)}
.saved{font-size:12px;color:var(--ok);display:flex;align-items:center;gap:6px;margin-top:6px}
.saved svg{width:15px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;border:1px solid var(--line);background:#fff;padding:6px;border-radius:10px;margin:22px 0}
.step{padding:9px 10px;border-radius:7px;color:#858897;font-size:12px;font-weight:700;display:flex;gap:7px;align-items:center}
.step span{width:21px;height:21px;border-radius:50%;background:#f0f0f4;display:grid;place-items:center;font-size:11px}
.step.active{background:var(--accent-soft);color:var(--accent)}
.step.active span{background:var(--accent);color:#fff}
.form{max-width:760px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px}
.form h2{font-size:20px;margin:0 0 22px}
.section{padding-top:22px;margin-top:22px;border-top:1px solid var(--line)}
.section:first-of-type{padding-top:0;margin-top:0;border-top:0}
.sectionTitle{font-weight:800;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:14px}
.field label{display:flex;align-items:center;gap:5px;font-weight:700;margin-bottom:6px;position:relative}
.infoBtn{width:18px;height:18px;border:0;background:transparent;padding:0;display:inline-grid;place-items:center;color:#9a9dac;border-radius:50%}
.infoBtn:hover{color:var(--accent);background:var(--accent-soft)}
.infoBtn svg{width:14px;height:14px}
.infoPopover{position:absolute;z-index:60;top:25px;left:0;width:min(290px,80vw);background:#242433;color:#fff;border-radius:8px;padding:9px 10px;font-size:11px;line-height:1.45;font-weight:500;box-shadow:0 10px 24px #0003}
.infoPopover:before{content:"";position:absolute;top:-5px;left:18px;width:10px;height:10px;background:#242433;transform:rotate(45deg)}
.req{color:var(--danger)}
input,select{width:100%;height:42px;border:1px solid #d8d9e1;border-radius:8px;padding:0 11px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #6b50f610}
.hint{font-size:11px;color:var(--muted);margin-top:5px}
.check{display:flex;align-items:flex-start;gap:9px;margin:10px 0}
.check input{width:17px;height:17px;margin:2px 0}
.conditional{margin:8px 0 12px 26px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fafafd}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn svg{width:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border:0;color:var(--accent);padding:6px 0;background:none}
.btn.icon{border:0;background:none;padding:6px;color:#888b99}
.artistPicker{position:relative}
.search{position:relative}
.search>svg{position:absolute;left:11px;top:12px;width:16px;color:#999}
.search input{padding-left:36px}
.dropdown{position:absolute;z-index:20;top:46px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px;box-shadow:0 12px 28px #0002}
.artistRow{display:grid;grid-template-columns:36px 1fr auto;gap:9px;align-items:center;padding:8px;border-radius:7px}
.artistRow:hover{background:#f7f6ff}
.avatar{width:36px;height:36px;border-radius:50%;background:#ececf2;display:grid;place-items:center;font-size:11px;font-weight:800;color:#707383}
.artistName{display:block;font-weight:700}
.artistId{font-size:10px;color:#999cac}
.artistRow>svg{width:17px;color:var(--accent)}
.newArtist{border-top:1px solid var(--line);margin-top:4px;padding:9px 8px;color:var(--accent);font-weight:700;display:flex;gap:7px;align-items:center}
.newArtist svg{width:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);border-radius:20px;padding:5px 8px;background:#fafafd;font-size:11px;display:flex;gap:5px;align-items:center}
.labelRow{display:grid;grid-template-columns:1fr auto;gap:8px}
.selectPicker{position:relative}.selectValue{min-height:42px;border:1px solid #d8d9e1;border-radius:8px;padding:0 11px;display:flex;align-items:center;justify-content:space-between;background:#fff;cursor:pointer}.selectValue svg{width:16px;color:#9093a1}.selectMenu{position:absolute;z-index:25;left:0;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px;box-shadow:0 12px 28px #0002}.selectSearch{position:relative;margin-bottom:4px}.selectSearch svg{position:absolute;left:10px;top:10px;width:15px;color:#999}.selectSearch input{height:36px;padding-left:33px}.option{padding:9px 10px;border-radius:6px;cursor:pointer}.option:hover{background:#f7f6ff}.option.selected{color:var(--accent);font-weight:700;background:var(--accent-soft)}
.localizedTitle{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.titleLangTabs{display:flex;gap:4px;align-items:center;padding:7px;border-bottom:1px solid var(--line);background:#fafafd;overflow:auto}
.langTab{border:0;background:transparent;border-radius:7px;padding:7px 10px;font-weight:700;font-size:12px;color:#777a89;white-space:nowrap}
.langTab.active{background:#fff;color:var(--accent);box-shadow:0 0 0 1px var(--line)}
.langAdd{margin-left:auto;border:0;background:transparent;color:var(--accent);font-weight:700;padding:7px 9px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.langAdd svg{width:14px}
.titleEditor{padding:12px}
.titleEditor .field{margin:0}
.titlePreview{border-top:1px solid var(--line);padding:10px 12px;background:#fcfcfe}
.previewLabel{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#9a9dac;font-weight:800;margin-bottom:7px}
.previewList{display:grid;gap:6px}
.previewRow{display:grid;grid-template-columns:72px 1fr;gap:10px;font-size:12px}
.previewRow span:first-child{color:#858897}
.previewValue{font-weight:700;color:#343442}
.localeBox{border:1px solid var(--line);border-radius:9px;overflow:hidden}.localeHead{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;background:#fafafd;border-bottom:1px solid var(--line)}.localeHead b{font-size:12px}.localeRow{padding:12px}.localeRow+.localeRow{border-top:1px solid var(--line)}.localeLang{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:12px;font-weight:700}.translationEmpty{display:flex;align-items:center;justify-content:space-between;padding:10px 0}.translationEmpty span{font-size:12px;color:var(--muted)}
.inlineMeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.metaTag{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;background:#f5f5f8;border-radius:20px;font-size:11px;color:#6f7281}.metaTag svg{width:13px}

.upload{border:1.5px dashed #d4d1e5;border-radius:10px;padding:22px;text-align:center;background:#fbfaff}
.addSongBar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.addSongBar .hint{margin:0}
.songChoiceGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.songChoice{border:1px solid var(--line);border-radius:10px;background:#fff;padding:18px;text-align:left}
.songChoice:hover{border-color:var(--accent);background:var(--accent-soft)}
.songChoice svg{width:23px;color:var(--accent)}
.songChoice h4{margin:8px 0 2px;font-size:14px}
.songChoice p{margin:0;color:var(--muted);font-size:11px}
.librarySearch{position:relative;margin-bottom:10px}
.librarySearch svg{position:absolute;left:11px;top:12px;width:16px;color:#999}
.librarySearch input{padding-left:36px}
.assetList{display:grid;gap:7px;max-height:320px;overflow:auto}
.assetRow{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:9px;cursor:pointer}
.assetRow:hover{border-color:#cfc9ff;background:#faf9ff}
.assetThumb{width:42px;height:42px;border-radius:7px;background:#efeff4;display:grid;place-items:center;color:#7b7e8d}
.assetThumb svg{width:18px}
.assetTitle{font-weight:800;display:block}
.assetMeta{font-size:10px;color:#9699a9}
.assetCode{font-size:10px;color:#7b7e8d;background:#f4f4f7;border-radius:20px;padding:4px 7px}
.assetSelected{border-color:var(--accent);background:var(--accent-soft)}
.assetSource{font-size:10px;color:var(--accent);font-weight:700;margin-top:2px}

.upload svg{width:24px;color:var(--accent)}
.upload b{display:block;margin:5px 0}
.track{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-top:12px;background:#fff}
.trackHead{display:grid;grid-template-columns:38px minmax(0,1fr) 20px;gap:12px;align-items:center;padding:14px 15px;cursor:pointer}
.trackHead:hover{background:#fcfbff}
.trackHead>svg{width:18px;color:#9497a4}
.trackNo{width:32px;height:32px;border-radius:9px;background:#f3f1ff;color:var(--accent);display:grid;place-items:center;font-weight:850;font-size:12px}
.trackMain{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:14px}
.trackMainInfo{min-width:0;flex:1}
.trackTitle{font-weight:850;font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trackMeta{font-size:11px;color:#999cab;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trackSummary{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.trackStatusPill{font-size:9px;padding:4px 7px;border-radius:999px;border:1px solid var(--line);background:#fafafd;color:var(--muted);white-space:nowrap}
.trackBody{border-top:1px solid var(--line);padding:16px;background:#fbfbfd}
@media(max-width:680px){
 .trackMain{align-items:flex-start;flex-direction:column;gap:8px}
 .trackSummary{justify-content:flex-start}
}
.badge{font-size:10px;background:#fff5df;color:#996811;border-radius:20px;padding:4px 7px;font-weight:700}
.trackBody{border-top:1px solid var(--line);padding:18px;background:#fefeff}
.contribGroup{margin-top:15px}
.contribHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.contribHeader b{font-size:13px}
.person{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:7px}
.person .avatar{width:34px;height:34px}
.personName{font-weight:700;display:block}
.affil{font-size:11px;color:#777a89}
.personActions{display:flex}
.footer{max-width:760px;margin:18px auto 0;display:flex;justify-content:space-between}
.modePill{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:5px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-weight:700;margin-bottom:14px}
.modalBack{position:fixed;z-index:100;inset:0;background:#1c1c2788;display:grid;place-items:center;padding:20px}
.modal{width:min(480px,100%);background:#fff;border-radius:12px;border:1px solid var(--line);padding:22px;box-shadow:0 24px 70px #0005}
.modalHead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.modalHead h3{margin:0;font-size:19px}
.modalFooter{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.choiceGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:1px solid var(--line);background:#fff;border-radius:10px;padding:20px;text-align:left}
.choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice svg{width:24px;color:var(--accent)}
.choice h3{font-size:16px;margin:8px 0 2px}
.choice p{font-size:12px;color:var(--muted);margin:0}
.placeholder{border:1.5px dashed var(--line);border-radius:10px;padding:38px;text-align:center;color:var(--muted)}
.placeholder svg{width:28px;color:var(--accent)}
@media(max-width:820px){
 .app{grid-template-columns:1fr}.sidebar{display:none}main{padding:20px}.grid2{grid-template-columns:1fr}
 .steps{grid-template-columns:repeat(5,160px);overflow:auto}
}

.addTrackModal{width:min(620px,100%);padding:0;overflow:hidden}
.addTrackHeader{padding:22px 22px 14px;display:flex;align-items:flex-start;justify-content:space-between}
.addTrackHeader h3{margin:0;font-size:20px}
.addTrackBody{padding:0 22px 20px}
.dropzone{border:1.5px dashed #cfcfda;border-radius:10px;background:#fafafe;min-height:142px;display:grid;place-items:center;text-align:center;padding:22px;cursor:pointer}
.dropzone:hover{border-color:var(--accent);background:var(--accent-soft)}
.dropzone svg{width:27px;color:var(--accent)}
.dropzone b{display:block;margin:7px 0 2px;font-size:14px}
.dropzone span{font-size:11px;color:var(--muted)}
.orDivider{display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:#9a9dac;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.orDivider:before,.orDivider:after{content:"";height:1px;background:var(--line);flex:1}
.songLibraryTitle{font-size:13px;font-weight:800;margin-bottom:9px}
.librarySearch{position:relative;margin-bottom:8px}
.librarySearch svg{position:absolute;left:11px;top:12px;width:16px;color:#999}
.librarySearch input{padding-left:36px}
.songList{display:grid;gap:2px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:4px}
.songItem{display:grid;grid-template-columns:22px 38px 1fr auto;gap:9px;align-items:center;padding:8px;border-radius:7px;cursor:pointer}
.songItem:hover{background:#f7f6ff}
.songItem.selected{background:var(--accent-soft)}
.songCheck{width:17px;height:17px}
.songIcon{width:38px;height:38px;border-radius:7px;background:#eeeeF3;display:grid;place-items:center;color:#7b7e8d}
.songIcon svg{width:17px}
.songInfo b{display:block;font-size:12px}
.songInfo span{display:block;font-size:10px;color:#9598a8;margin-top:1px}
.songRight{font-size:10px;color:#7d8090;text-align:right}
.addTrackFooter{border-top:1px solid var(--line);padding:14px 22px;display:flex;justify-content:flex-end;gap:8px;background:#fff}
.uploadedQueue{display:grid;gap:7px;margin-top:10px}
.uploadedItem{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}
.uploadedItem svg{width:17px;color:var(--accent)}
.uploadedItem b{font-size:11px}
.uploadedItem span{font-size:10px;color:var(--muted);display:block}


.usageNotice{border:1px solid #e4d7a6;background:#fffaf0;border-radius:9px;padding:12px;margin-bottom:16px}
.usageNoticeTop{display:flex;gap:9px;align-items:flex-start}
.usageNoticeTop>svg{width:17px;color:#9a6a18;margin-top:1px;flex:none}
.usageNotice b{display:block;font-size:12px;margin-bottom:2px}
.usageNotice p{margin:0;color:#76663f;font-size:11px;line-height:1.45}
.usageList{margin-top:10px;border-top:1px solid #eadfb8;padding-top:8px;display:grid;gap:6px}
.usageItem{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid #ebe2c7;border-radius:7px;padding:8px 9px}
.usageAlbum{font-size:11px;font-weight:800}
.usageMeta{font-size:10px;color:#89816d;margin-top:2px}
.usageUPC{font-size:10px;color:#6e6654;text-align:right}
.trackEditNote{display:flex;align-items:center;gap:6px;font-size:10px;color:#7b7e8d;margin:-3px 0 14px}
.trackEditNote svg{width:13px}
.trackArtistPicker{position:relative}
.trackGenrePicker{position:relative}


.choiceRow{display:flex;gap:8px;flex-wrap:wrap}
.identifierAuto{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);background:#fafafd;border-radius:8px;padding:11px 12px;font-size:12px}
.identifierAuto svg{width:17px;color:var(--accent);flex:none;margin-top:1px}
.identifierAuto b{display:block}
.identifierAuto span{display:block;color:var(--muted);font-size:10px;margin-top:2px;line-height:1.4}
.identifierWarn{display:flex;gap:7px;align-items:flex-start;margin-top:8px;color:#78643a;font-size:10px;line-height:1.4}
.identifierWarn svg{width:13px;flex:none;margin-top:1px}
.radioCard{flex:1;min-width:150px;border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:flex;align-items:center;gap:8px;background:#fff;cursor:pointer}
.radioCard:hover{border-color:#cfc9ff}
.radioCard.active{border-color:var(--accent);background:var(--accent-soft)}
.radioCard input{width:16px;height:16px;margin:0}
.radioCard b{font-size:12px}
.lyricsBox textarea{width:100%;min-height:180px;resize:vertical;border:1px solid #d8d9e1;border-radius:8px;padding:11px;font:inherit;outline:none;line-height:1.55}
.lyricsBox textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #6b50f610}
.charCount{font-size:10px;color:#999cab;text-align:right;margin-top:4px}


.inheritedField{min-height:42px;border:1px solid #e1e1e8;border-radius:8px;background:#fafafd;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.inheritedMain{display:flex;align-items:center;gap:8px;min-width:0}
.inheritedMain .avatar{width:28px;height:28px;font-size:9px;flex:none}
.inheritedName{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inheritedSource{display:flex;align-items:center;gap:4px;color:#9598a7;font-size:10px;white-space:nowrap}
.inheritedSource svg{width:12px}
.emptyInherited{font-size:11px;color:#9a9dac}
.releaseOnlyLabel{display:flex;align-items:center;gap:5px}
.releaseOnlyLabel .infoBtn{position:relative}
.singleUploadOnly{padding-top:4px}


.audioSource{border:1px solid var(--line);border-radius:10px;background:#fafafd;padding:12px;margin-bottom:14px}
.audioSourceTop{display:flex;align-items:center;gap:10px}
.audioPlay{width:34px;height:34px;border-radius:50%;border:0;background:#ececf3;display:grid;place-items:center;flex:none;cursor:pointer}
.audioPlay svg{width:15px}
.audioFile{min-width:0;flex:1}
.audioFile b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.audioFile span{font-size:10px;color:var(--muted)}
.audioDuration{font-size:11px;font-weight:800;white-space:nowrap}
.waveform{height:30px;display:flex;align-items:center;gap:2px;flex:1;min-width:100px;overflow:hidden}
.waveform i{display:block;width:2px;background:#a8a9b3;border-radius:2px;opacity:.8}
.audioActions{display:flex;gap:3px;flex:none}
.audioMeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.audioMeta span{font-size:10px;color:#686b78;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 7px}
.audioMeta .sourceName{margin-right:auto;background:transparent;border:0;padding-left:0;color:var(--muted)}
@media(max-width:760px){.waveform{display:none}}


.uploadProgress{margin-top:10px}
.uploadProgressTop{display:flex;justify-content:space-between;gap:12px;font-size:10px;color:var(--muted);margin-bottom:5px}
.uploadProgressTop b{color:var(--text);font-size:10px}
.uploadProgressBar{height:6px;border-radius:99px;background:#e8e8ef;overflow:hidden}
.uploadProgressBar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .18s ease}


/* v28 interaction/demo additions */
.translationToggle{width:100%;border:0;border-top:1px solid var(--line);background:#fafafd;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;font-weight:800;color:#626574}
.translationToggle span{display:flex;align-items:center;gap:7px}.translationToggle svg{width:15px}
.translationPanel{border-top:1px solid var(--line);background:#fcfcfe;padding:12px}
.translationRow{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center;margin-bottom:9px}

function info(text){

function renderArtistSearchResults(q=''){
 const box=document.getElementById('artistSearchList');if(!box)return;
 const query=q.trim().toLowerCase();
 const already=new Set(artistList(artistModalKind).map(a=>a.id));
 const rows=artists
   .filter(a=>(!query||a.name.toLowerCase().includes(query)||a.id.toLowerCase().includes(query)))
   .map(a=>{
     const exists=already.has(a.id),picked=artistModalSelection.has(a.id);
     return `<div class="artistSearchResult ${picked?'selected':''}" ${exists?'style="opacity:.48;cursor:not-allowed"':''} onclick="${exists?'':`toggleArtistModalSelection('${a.id}')`}">
       <span class="avatar">${initials(a.name)}</span>
       <span>
         <span class="artistResultName">${a.name}</span>
         <span class="artistResultId">Artist ID · ${a.id}</span>
       </span>
       <i data-lucide="${exists?'check':picked?'check-circle-2':'plus-circle'}"></i>
     </div>`;
   }).join('');
 box.innerHTML=rows||`<div class="hint" style="padding:18px">Артист олдсонгүй. “Шинэ артист үүсгэх” товчоор бүртгэж болно.</div>`;
 const btn=document.getElementById('artistSelectConfirm');
 if(btn){
   btn.disabled=!artistModalSelection.size;
   btn.textContent=artistModalSelection.size?`Сонгох (${artistModalSelection.size})`:'Сонгох';
 }
 icons();
}
function toggleArtistModalSelection(id){
 if(artistModalSelection.has(id))artistModalSelection.delete(id);else artistModalSelection.add(id);
 renderArtistSearchResults(document.getElementById('artistModalSearchInput')?.value||'');
}
function confirmArtistSelection(){
 const target=artistList(artistModalKind);
 artistModalSelection.forEach(id=>{
   const a=artists.find(x=>x.id===id);
   if(a&&!target.some(x=>x.id===id))target.push(a);
 });
 document.getElementById('artistSearchModal')?.remove();
 render();autosave();
}

function createArtistFromModal(){
 const name=document.getElementById('newArtistName')?.value.trim();
 if(!name)return;
 const a={id:'ART-'+String(500+artists.length).padStart(6,'0'),name};
 artists.push(a);

 if(!target.some(x=>x.id===a.id))target.push(a);

 document.getElementById('artistSearchModal')?.remove();
 render();autosave();
}

function queueAudioFiles(input){
 const files=[...(input?.files||[])]; if(!files.length)return;
 const chosen=mode==='single'?files.slice(0,1):files;
 chosen.forEach((file,n)=>{
   const t=makeNewTrack(pendingUploads.length+1);
   t.title=file.name.replace(/\.[^.]+$/,''); t.titles.mn=t.title;
   t.sourceName=file.name; t.fileFormat=(file.name.split('.').pop()||'audio').toUpperCase();
   t.sampleRate='—';t.bitDepth='—';t.duration='—';t.pendingFile=file;
   pendingUploads.push(t); readAudioMetadata(t,file,()=>renderPendingUploads());
 });
 renderPendingUploads(); updateAddButton(); input.value='';
}

function renderSongLibrary(q){

   .filter(s=>s.title.toLowerCase().includes(query)||s.artist.toLowerCase().includes(query)||s.isrc.toLowerCase().includes(query))
   .map(s=>{
     const alreadyAdded=albumTracks.some(t=>t.assetId===s.assetId);
     const selected=addSongSelection.has(s.assetId);
     const usedText=s.usages?.length?`${s.usages.length} цомогт орсон`:s.isrc;
     return `<div class="songItem ${selected?'selected':''}" ${alreadyAdded?'style="opacity:.48;cursor:default"':`onclick="toggleSongSelection('${s.assetId}')"`}>
       <input class="songCheck" type="checkbox" ${selected?'checked':''} ${alreadyAdded?'disabled':''} onclick="event.stopPropagation();${alreadyAdded?'':`toggleSongSelection('${s.assetId}')`}">
       <span class="songIcon"><i data-lucide="music-2"></i></span>

function formatDuration(sec){if(!Number.isFinite(sec)||sec<=0)return '—';const m=Math.floor(sec/60),s=Math.round(sec%60);return `${m}:${String(s).padStart(2,'0')}`}
async function readAudioMetadata(t,file,done){
 try{
   const buf=await file.arrayBuffer();
   const dv=new DataView(buf);
   const isWav=buf.byteLength>44 && String.fromCharCode(...new Uint8Array(buf.slice(0,4)))==='RIFF' && String.fromCharCode(...new Uint8Array(buf.slice(8,12)))==='WAVE';
   if(isWav){
     let off=12,fmt=null,dataSize=0;
     while(off+8<=dv.byteLength){const id=String.fromCharCode(dv.getUint8(off),dv.getUint8(off+1),dv.getUint8(off+2),dv.getUint8(off+3));const size=dv.getUint32(off+4,true);if(id==='fmt '&&size>=16)fmt={sampleRate:dv.getUint32(off+12,true),byteRate:dv.getUint32(off+16,true),bits:dv.getUint16(off+22,true)};if(id==='data'){dataSize=size;break}off+=8+size+(size%2)}
     if(fmt){t.sampleRate=`${(fmt.sampleRate/1000).toFixed(fmt.sampleRate%1000?1:0)} kHz`;t.bitDepth=`${fmt.bits}-bit`;if(dataSize&&fmt.byteRate)t.duration=formatDuration(dataSize/fmt.byteRate)}
   }
 }catch(e){}
 if(done)done();
}

 const file=input?.files?.[0];if(!file)return;const t=albumTracks[i];

   if(p>=100){clearInterval(timer);if(current.audioUrl)URL.revokeObjectURL(current.audioUrl);current.audioUrl=URL.createObjectURL(file);current.sourceName=file.name;current.fileFormat=(file.name.split('.').pop()||'audio').toUpperCase();current.sampleRate='—';current.bitDepth='—';current.uploading=false;current.pendingSourceName='';readAudioMetadata(current,file,()=>{render();autosave()});}

 },180);input.value='';
}

let draggedTrackIndex=null;

function trackDragStart(event,index){
 if(mode!=='album')return;
 draggedTrackIndex=index;
 event.dataTransfer.effectAllowed='move';
 event.dataTransfer.setData('text/plain',String(index));
 requestAnimationFrame(()=>event.currentTarget.closest('.track')?.classList.add('dragging'));
}
function trackDragOver(event,index){
 if(mode!=='album' || draggedTrackIndex===null || draggedTrackIndex===index)return;
 event.preventDefault();
 event.dataTransfer.dropEffect='move';
 document.querySelectorAll('.track.dragOver').forEach(el=>el.classList.remove('dragOver'));
 event.currentTarget.classList.add('dragOver');
}
function trackDragLeave(event){
 if(!event.currentTarget.contains(event.relatedTarget))event.currentTarget.classList.remove('dragOver');
}
function trackDrop(event,targetIndex){
 if(mode!=='album')return;
 event.preventDefault();
 const from=draggedTrackIndex!==null?draggedTrackIndex:Number(event.dataTransfer.getData('text/plain'));
 document.querySelectorAll('.track.dragOver').forEach(el=>el.classList.remove('dragOver'));
 if(Number.isNaN(from)||from===targetIndex){trackDragEnd();return;}

 const [moved]=albumTracks.splice(from,1);
 albumTracks.splice(targetIndex,0,moved);

 if(openTrack===from)openTrack=targetIndex;
 else if(from<openTrack && targetIndex>=openTrack)openTrack--;
 else if(from>openTrack && targetIndex<=openTrack)openTrack++;

 draggedTrackIndex=null;
 render();
 autosave();
}
function trackDragEnd(){
 draggedTrackIndex=null;
 document.querySelectorAll('.track.dragging,.track.dragOver').forEach(el=>el.classList.remove('dragging','dragOver'));
}

function parseDuration(v){
 if(!v || v==='—') return 0;
 const p=v.split(':').map(Number);
 return p.length===2?p[0]*60+p[1]:0;
}
function portalTypeLabel(){
 if(mode==='single') return 'Single';
 const count=albumTracks.length;
 const total=albumTracks.reduce((s,t)=>s+parseDuration(t.duration),0);
 // Demo logic only. Production thresholds must come from the CMS business rule.
 if(count<=1) return 'Single';
 if(count<=6 && total<1800) return 'EP';
 return 'Album';
}
function totalDurationLabel(){
 const sec=albumTracks.reduce((s,t)=>s+parseDuration(t.duration),0);
 const m=Math.floor(sec/60), s=sec%60;
 return `${m}:${String(s).padStart(2,'0')}`;
}

function validateCoverFile(file,width,height){
 if(!['image/jpeg','image/png'].includes(file.type))return 'Ковер зураг JPG эсвэл PNG форматтай байх ёстой.';
 if(file.size>20*1024*1024)return 'Ковер зургийн файлын хэмжээ 20MB-аас их байж болохгүй.';
 if(width!==height)return 'Ковер зураг 1:1 харьцаатай, төгс квадрат байх ёстой.';
 if(width<1500||height<1500)return 'Ковер зураг хамгийн багадаа 1500 × 1500 px хэмжээтэй байх ёстой.';
 if(width>6000||height>6000)return 'Ковер зураг хамгийн ихдээ 6000 × 6000 px хэмжээтэй байж болно.';
 return '';
}
function handleCover(input){
 const file=input?.files?.[0];if(!file)return;
 coverError='';
 if(!['image/jpeg','image/png'].includes(file.type)){
   coverError='Ковер зураг JPG эсвэл PNG форматтай байх ёстой.';
   input.value='';render();return;
 }
 if(file.size>20*1024*1024){
   coverError='Ковер зургийн файлын хэмжээ 20MB-аас их байж болохгүй.';
   input.value='';render();return;
 }
 const reader=new FileReader();
 reader.onload=()=>{
   const img=new Image();
   img.onload=()=>{
     const error=validateCoverFile(file,img.naturalWidth,img.naturalHeight);
     if(error){
       coverError=error;
       input.value='';
       render();
       return;
     }
     cover={name:file.name,dataUrl:reader.result,width:img.naturalWidth,height:img.naturalHeight,size:file.size};
     coverError='';
     render();autosave();
   };
   img.onerror=()=>{coverError='Зургийн файлыг унших боломжгүй байна.';input.value='';render()};
   img.src=reader.result;
 };
 reader.readAsDataURL(file);
}
function handleCoverDrop(event){
 event.preventDefault();
 document.getElementById('coverDrop')?.classList.remove('drag');
 const file=event.dataTransfer?.files?.[0];if(!file)return;

 const input=document.getElementById('coverFile');input.files=dt.files;handleCover(input);
}

             <div><h4>Олон улсын хөгжмийн үйлчилгээнүүд</h4><p>Сонгосноор доорх бүх олон улсын платформд хүргэнэ.</p></div>
             ${groupToggleControl('Сонгосон',international)}
           </div>
           <div class="bundleServices">
             ${international.map(bundleServiceItem).join('')}
           </div>
         </div>

         <div class="serviceGroupModern">
           <div class="serviceGroupModernHead">
             <div><h4>Сурталчилгааны радио цацалт</h4><p>Дууг promotional airplay хэлбэрээр радио сувгаар цацуулах сонголт.</p></div>
             ${groupToggleControl('Сонгосон',promoRadio)}
           </div>
           <div class="bundleServices">
             ${promoRadio.map(bundleServiceItem).join('')}
           </div>
           <div class="promoRadioNote">
             <i data-lucide="info"></i>
             <span>Энэ радио цацалт нь сурталчилгааны зорилготой. Buteel энэ цацалтын royalty орлогыг тооцож, хуваарилахгүй. Хамаарах royalty-г эрх эзэмшигч өөрийн харьяалах Хамтын удирдлагын байгууллагаар бүртгүүлж, цуглуулах боломжтой.</span>
           </div>
         </div>

       </div>
     </div>
   </section>
 </div>`;
}
function reviewValue(v){return v||'—'}
function stage5(){
 if(submitted)return `<div class="successCard"><i data-lucide="circle-check-big"></i><h2>Илгээгдлээ</h2><p>${albumTitles.mn||'Энэ контент'} шалгалтын дараагийн шат руу шилжлээ.</p><div class="modePill" style="margin:14px auto 0;width:max-content"><i data-lucide="clock-3"></i>Review хүлээж байна</div></div>`;

 const title=albumTitles.mn||'—';
 const englishTitle=albumTitles.en||'—';
 const publishLabel=scheduleMode==='asap'?'Аль болох хурдан (2–3 ажлын өдөр)':reviewValue(releaseDate);
 const services=[...distributionServices];

 return `<div class="reviewShell">
   <div class="reviewHero">
     <div><h2>Шалгах & Илгээх</h2><p>Илгээхийн өмнө бүх мэдээллээ нэг удаа шалгана уу.</p></div>
     <span class="reviewHeroStatus"><i data-lucide="clipboard-check"></i>Илгээхэд бэлэн эсэхийг шалгах</span>
   </div>

   <div class="reviewModernGrid">
     <div class="reviewColumn">

       <section class="reviewPanel">
         <div class="reviewPanelHead">
           <div class="reviewPanelHeadTitle"><i data-lucide="info"></i><b>Үндсэн мэдээлэл</b></div>
           <button class="btn ghost" onclick="goStage(1)">Засах</button>
         </div>
         <div class="reviewPanelBody">
           <div class="reviewDataGrid">
             <div class="reviewDataItem"><span>Төрөл</span><b>${portalTypeLabel()}</b></div>
             <div class="reviewDataItem"><span>Монгол нэр</span><b>${title}</b></div>
             <div class="reviewDataItem"><span>English / Latin</span><b>${englishTitle}</b></div>
             <div class="reviewDataItem"><span>Үндсэн артист</span><b>${primary.map(a=>a.name).join(', ')||'—'}</b></div>
             <div class="reviewDataItem"><span>Жанр</span><b>${primaryGenre||'—'}</b></div>
             <div class="reviewDataItem"><span>Label</span><b>${accountLabel}</b></div>
             <div class="reviewDataItem"><span>UPC</span><b>${previous?(previousUPC||'Өмнөх UPC шаардлагатай'):'Автоматаар үүснэ'}</b></div>
             ${previous?`<div class="reviewDataItem"><span>Анх гарсан огноо</span><b>${originalReleaseDate||'—'}</b></div>`:''}
           </div>
         </div>
       </section>

       <section class="reviewPanel">
         <div class="reviewPanelHead">
           <div class="reviewPanelHeadTitle"><i data-lucide="list-music"></i><b>Дууны мэдээлэл</b></div>
           <button class="btn ghost" onclick="goStage(2)">Засах</button>
         </div>
         <div class="reviewPanelBody">
           <div class="reviewTracks">
             ${albumTracks.map((t,i)=>{
               const trackTitle=mode==='single'?(albumTitles.mn||t.title):(t.titles?.mn||t.title);
               ensureTrackArtistArrays(t);
               const artistsText=mode==='single'
                 ? (primary.map(a=>a.name).join(', ')||'—')
                 : (t.primaryArtists.map(a=>a.name).join(', ')||'—');
               const isrcText=t.isrc?displayISRC(t.isrc):'Автоматаар үүснэ';
               return `<div class="reviewTrackRow">
                 <span class="reviewTrackNo">${i+1}</span>
                 <span class="reviewTrackInfo"><b>${trackTitle||'—'}</b><span>${artistsText}</span></span>
                 <span class="reviewTrackMeta"><b>${t.duration||'—'}</b><span>${isrcText}</span></span>
               </div>`;
             }).join('')||'<div class="hint">Дуу нэмээгүй байна.</div>'}
           </div>
         </div>
       </section>

       <section class="reviewPanel">
         <div class="reviewPanelHead">
           <div class="reviewPanelHeadTitle"><i data-lucide="radio-tower"></i><b>Нийтлэх & Түгээх</b></div>
           <button class="btn ghost" onclick="goStage(4)">Засах</button>
         </div>
         <div class="reviewPanelBody">
           <div class="reviewDataGrid">
             <div class="reviewDataItem"><span>Нийтлэх хугацаа</span><b>${publishLabel}</b></div>
             <div class="reviewDataItem"><span>Үйлчилгээний тоо</span><b>${services.length}</b></div>
           </div>
           <div class="reviewServiceWrap" style="margin-top:12px">
             ${services.map(s=>`<span class="reviewServiceChip"><span class="publishSelectionDot">${serviceIconLabel(s)}</span>${s}</span>`).join('')}
           </div>
         </div>
       </section>

     </div>

     <div class="reviewColumn">

       <section class="reviewPanel">
         <div class="reviewPanelHead">
           <div class="reviewPanelHeadTitle"><i data-lucide="image"></i><b>Ковер зураг</b></div>
           <button class="btn ghost" onclick="goStage(3)">Засах</button>
         </div>
         <div class="reviewPanelBody">
           <div class="reviewCoverCard">
             <div class="reviewCoverPreview">
               ${cover.dataUrl?`<img src="${cover.dataUrl}" alt="Cover preview">`:`<div class="reviewCoverEmpty"><i data-lucide="image-off"></i><div>Ковер зураг оруулаагүй</div></div>`}
             </div>
             <div class="reviewDataGrid">
               <div class="reviewDataItem"><span>Файл</span><b>${cover.name||'—'}</b></div>
               <div class="reviewDataItem"><span>Хэмжээс</span><b>${cover.width?`${cover.width} × ${cover.height} px`:'—'}</b></div>
             </div>
           </div>
         </div>
       </section>

     </div>
   </div>

   <label class="reviewConfirmSimple">
     <input type="checkbox" ${reviewConfirmed?'checked':''} onchange="reviewConfirmed=this.checked;render()">
     <span><b>Мэдээллээ шалгасан</b><span>Оруулсан мэдээлэл зөв болохыг баталгаажуулна.</span></span>
   </label>
 </div>`;
}
function submitRelease(){if(!reviewConfirmed)return;submitted=true;render()}

function updateFooter(){
 const b=document.getElementById('nextBtn');if(!b)return;
 if(submitted){b.style.display='none';return}b.style.display='inline-flex';
 if(stage===5){b.disabled=!reviewConfirmed;b.innerHTML='Илгээх<i data-lucide="send"></i>'}else{b.disabled=false;b.innerHTML='Үргэлжлүүлэх<i data-lucide="arrow-right"></i>'}icons();
}
function render(){
 if(!mode){chooseMode();return}
 document.getElementById('pageTitle').textContent=mode==='album'?'Цомог үүсгэх':'Дуу үүсгэх';
 renderSteps();
 document.getElementById('form').innerHTML=stage===1?stage1():stage===2?stage2():stage===3?stage3():stage===4?stage4():stage5();
 icons();updateFooter();
}
function next(){if(stage<5){goStage(stage+1)}else submitRelease()}
function back(){if(stage>1){goStage(stage-1)}else{mode=null;stage=1;openTrack=-1;chooseMode()}}

render()
</script>
</body>
</html>
